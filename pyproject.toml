[project]
name = "showthework"
version = "0.1.0"
description = "Score resumes on quoted evidence, not prose. Every score comes with the quote that earned it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mariano Mattei" }]
requires-python = ">=3.10"
dependencies = ["anthropic>=0.97", "pydantic>=2"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
showthework = "showthework.cli:main"

[project.urls]
Homepage = "https://github.com/Mariano215/showthework"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["showthework"]
